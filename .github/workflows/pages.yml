# The web UI as a GitHub Pages site: the page itself plus its images.
# The page keeps working from Pages by calling a local server on 127.0.0.1:8765
# (no device access exists on GitHub); run host/webui/server.py for real control.
name: Web UI (Pages)

on:
  push:
    branches: [main]
    paths:
      - "host/webui/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the static site
        run: |
          mkdir -p _site
          cp host/webui/index.html _site/
          cp -r host/webui/static _site/static
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
