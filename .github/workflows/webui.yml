name: Web UI

on:
  push:
    branches: [main]
    paths:
      - "host/webui/**"
      - "host/tests/**"
      - ".github/workflows/webui.yml"
  pull_request:
    paths:
      - "host/webui/**"
      - "host/tests/**"
      - ".github/workflows/webui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node tests (validator, lights, settings, DFU engine)
        run: node --test host/tests/test_smcpad_js.mjs
      - name: Fixtures for the Python suite (work/ is not committed)
        run: python3 host/tests/make_fixtures.py
      - name: Python tests
        run: python3 host/tests/test_webui.py
